<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIMPUS-Mini | Sign In</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <h1>SIMPUS-Mini</h1>
      <input type="checkbox" id="nav-toggle" class="nav-toggle" />
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="books/list.html">Book List</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </nav>
      <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
    </header>

    <main>
      <section>
        <h2>Login Member</h2>
        <p>Fill in your details below to login.</p>
      </section>

      <section>
        <form action="#" method="get">
          <p>
            <label for="email">Email Address:</label><br />
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter email address"
              required
            />
          </p>
          <p>
            <label for="password">Password:</label><br />
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              required
            />
          </p>
          <p>
            <button type="submit">Login</button>
          </p>
          <p>Already registered? <a href="register.html">Sign up here</a></p>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3</p>
    </footer>
  </body>
</html>
